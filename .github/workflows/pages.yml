name: Build and deploy SAI Lab site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Check links available without private media
        run: npm run check
        env:
          SAI_SKIP_PRIVATE_MEDIA_CHECK: '1'
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Identify media delivery
        id: media
        run: |
          mode=$(node -e "const d=require('./content/media-delivery.json');process.stdout.write(d.mode||'github')")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Install
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Check out public renditions for Pages
        if: steps.media.outputs.mode == 'pages_artifact'
        uses: actions/checkout@v4
        with:
          repository: Signal-Augmented-Intelligence/sai-lab-media-backup
          token: ${{ secrets.MEDIA_BACKUP_READ_TOKEN }}
          path: .private-media
          persist-credentials: false
          sparse-checkout: |
            public
            manifests
      - name: Verify and stage public renditions
        if: steps.media.outputs.mode == 'pages_artifact'
        run: node scripts/stage-private-media.mjs .private-media
      - name: Remove private checkout before running site scripts
        if: always() && steps.media.outputs.mode == 'pages_artifact'
        run: rm -rf -- .private-media
      - name: Check local links and personal information
        run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
