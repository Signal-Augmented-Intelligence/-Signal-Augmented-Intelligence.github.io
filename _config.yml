# SAI Lab website. Content lives in _data/ and _publications/; see guideline.md.
# draft: true keeps the deployed site out of search engines (noindex, robots Disallow) and shows a footer note.
locale: en-US
site_theme: default
title: "SAI Lab"
title_separator: "·"
name: "SAI Lab"
description: "SAI Lab (Signal Augmented Intelligence) at Hanshin University. Research on speech and acoustic signal processing, speech recognition, and learning-based signal enhancement."
url: "https://signal-augmented-intelligence.github.io"
baseurl: ""
repository: "Signal-Augmented-Intelligence/Signal-Augmented-Intelligence.github.io"
social:
  type: Organization
  name: "SAI Lab"
author:
  name: "SAI Lab"
draft: true
breadcrumbs: false
future: true
read_more: disabled
atom_feed:
  hide: true
analytics:
  provider: false
include:
  - _pages
exclude:
  - README.md
  - guideline.md
  - DESIGN_NOTES.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .github
  - .bundle
  - vendor
  - node_modules
  - scripts
  - tools
  - assets/js/_main.js
  - assets/js/plugins
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
collections:
  publications:
    output: true
    permalink: /publications/:path/
  research:
    output: true
    permalink: /research/:path/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: archive
      author_profile: false
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      author_profile: false
  - scope:
      path: ""
      type: research
    values:
      layout: research-area
      author_profile: false
sass:
  sass_dir: _sass
  style: compressed
timezone: Asia/Seoul
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
compress_html:
  clippings: all
  ignore:
    envs: development
