# Top menu. `match`: URL prefixes (comma-separated) that mark the item as the current page.
# Contact appears only when _data/lab.yml has an email or location.
main:
  - title: "Members"
    url: /members/professor/
    match: "/members/"
  - title: "Research"
    url: /research/
    match: "/research/,/publications/"
  - title: "Seminars"
    url: /seminars/
    match: "/seminars/"
  - title: "Contact"
    url: /contact/
    match: "/contact/"
    requires_contact: true

# Tabs under Members and Research.
members:
  - title: "Professor"
    url: /members/professor/
  - title: "Our Team"
    url: /members/our-team/
  - title: "Alumni"
    url: /members/alumni/
research:
  - title: "Areas"
    url: /research/
  - title: "Publications"
    url: /research/publications/

# Footer quick links.
footer:
  - title: "Research Areas"
    url: /research/
  - title: "Publications"
    url: /research/publications/
  - title: "Seminars"
    url: /seminars/
  - title: "News"
    url: /news/
  - title: "Contact"
    url: /contact/
    requires_contact: true
