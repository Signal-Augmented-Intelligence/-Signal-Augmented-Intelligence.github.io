---
layout: default
---
<div id="main" role="main">
  <div class="archive">
    <h1 class="page__title">{{ page.section_title | default: page.title }}</h1>
    {% if page.subnav %}{% assign subnav_items = site.data.navigation[page.subnav] %}{% include subnav.html items=subnav_items label=page.section_title %}{% endif %}
    {{ content }}
  </div>
</div>
