# The lab poem. Shown in full at the bottom of Home (#poem); `hero` picks the stanza shown in the first screen.
title: "신호 증강지능"
hero: 5            # 1-based stanza number
credit: ""         # 출처 표기 (비우면 표시하지 않음)
stanzas:
  - - "세상의 작은 떨림에 마음을 두어,"
    - "어둠에 잠긴 기척을 찾고,"
    - "스쳐 가는 신호의 의미를 묻는다."
  - - "그 물음에 답하듯, 신호는 세상이 건네는 언어."
    - "지능은 그 안의 결을 스펙트럼으로 읽어"
    - "흩어진 표본을 하나의 의미로 엮는다."
  - - "그 읽기는 언제나 사람의 몫,"
    - "기계는 곁에서 그 감각을 증강하고,"
    - "사람은 그 위에 뜻을 새긴다."
  - - "흐림이 걷힌 자리에 서로 다른 지능이 모여,"
    - "사람의 감각은 더 멀리 닿고,"
    - "이해의 깊이는 한 층 더 깊어진다."
  - - "신호와 지능이 만나는 이곳에서,"
    - "가장 희미한 떨림도 온전히 전해지도록,"
    - "오늘의 질문으로 내일의 길을 연다."
